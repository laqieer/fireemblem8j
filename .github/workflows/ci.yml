name: CI

# Single per-commit CI run that REPLACES the old split workflows
# (make compare + Self-contained build + layout consistency + decomp.dev report +
# Decomp progress + Pages). They duplicated the expensive agbcc+toolchain+build;
# this runs it ONCE and folds in every gate + the GitHub Pages generate/deploy.
# `Backfill decomp progress` stays separate (manual workflow_dispatch only).
#
# Progress compute/report/upload AND Pages generate/deploy run on push-to-main
# only; pull_request runs the build-match + shiftability gates only (fast PR
# checks, no Pages deploy). Pages deploy is a separate least-privilege job.
#
# NO baserom.gba dependency. The build is self-contained (0 `.incbin "baserom.gba"`),
# so building from committed source with baserom ABSENT and checking sha1 against
# checksum.sha1 (7da0456...) is simultaneously the byte-match oracle AND the
# self-contained acceptance test. The copyrighted ROM is never fetched or needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PROGRESS_API_KEY: ${{ secrets.PROGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # upload-progress.py needs the commit timestamp + hash
          submodules: recursive   # mgfembp (FE6 SIO payload) builds from source (F1)

      # ---- Fast repo-consistency gates (seconds, no toolchain, fail early) ----
      - name: Self-containment metric (0 baserom incbins — blocking)
        run: python3 scripts/check_selfcontained.py

      - name: Layout consistency (every linked object has committed source)
        run: python3 scripts/check_layout.py

      - name: No tracked zero-byte files
        run: python3 scripts/check_no_empty_files.py

      - name: INCBIN build-dep guard (clean-build asset ordering)
        # Catches the class that broke CI on 2026-06-15: a src/data INCBIN of a
        # generated (gitignored) asset with no make-dependency -> a clean parallel
        # build compiles the .incbin before gbagfx produces the asset. Multi-path
        # INCBIN_U8("a","b",...) aware. Runs WITHOUT a build, so the signal is instant.
        run: python3 scripts/check_incbin_deps.py

      # ---- Toolchain (agbcc + binutils + asset tools), built once ----
      - name: Install dependencies
        run: |
          sudo apt-get update
          # bash + libpng-dev are also needed by the mgfembp submodule sub-build (F1):
          # it builds its own agbcc (tools/install_agbcc.sh is a bash script) and its own
          # gbagfx (#include <png.h>) to produce the FE6 SIO multiboot payload from source.
          # iconv is provided by glibc (the mgfembp C pipeline pipes through `iconv`).
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev bash
          # numpy + Pillow are required by the TSA/graphics generators (scripts/gfxtools/
          # tsa_generator.py = FETSATOOL) that build the battle-bg .feimg3/.fetsa3 from the
          # editable .png sources -- same deps fe8u's CI installs. The make-compare byte gate
          # is unchanged; this only lets CI build the editable-source tool.
          python3 -m pip install ttp requests numpy Pillow

      - name: Cache agbcc toolchain
        # tools/agbcc is fully determined by the pinned pret/agbcc commit (embedded in
        # build_jp_agbcc.sh) + the -mjp-promote patch, so hashing those two files is a
        # sound cache key. On a hit the compiler is restored and the multi-minute build
        # below is skipped; `make compare` still re-verifies every byte, so a stale or
        # bad cache can never silently pass. Bump the key by editing either file.
        id: cache-agbcc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/agbcc
          key: agbcc-${{ runner.os }}-${{ hashFiles('scripts/build_jp_agbcc.sh', 'scripts/agbcc_jp_promote.patch') }}

      - name: Install agbcc (with the -mjp-promote flag, D276c)
        # Applies scripts/agbcc_jp_promote.patch BEFORE ./build.sh, so the toolchain
        # is built exactly once with the flag baked in (default-off = byte-identical
        # to stock; the Makefile enables it per-TU for the JP-promotion functions).
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        run: bash scripts/build_jp_agbcc.sh

      - name: Setup asset toolchain (gbagfx/bin2c/preproc/aif2pcm/mid2agb)
        run: |
          git clone --depth 1 https://github.com/laqieer/fireemblem8u.git ../fireemblem8u || true
          scripts/tools/gbagfx/setup.sh
          scripts/tools/bin2c/setup.sh
          scripts/tools/preproc/setup.sh
          scripts/tools/aif2pcm/setup.sh
          # mid2agb builds the editable .mid songs (D311); already-vendored setup, just wire it into CI
          scripts/tools/mid2agb/setup.sh
          # scaninc scans banim/*_motion.s include deps for the battle-animation
          # compressing-linker pipeline (BA1); builds from pret upstream source.
          scripts/tools/scaninc/setup.sh

      # ---- THE byte-perfect, self-contained gate (baserom.gba ABSENT) ----
      - name: Build from source + byte-match (make compare, no baserom)
        # `make compare` builds fireemblem8.gba from committed source and runs
        # `sha1sum -c checksum.sha1` (expects 7da0456...). With baserom.gba absent,
        # a successful build PROVES self-containment and the sha1 PROVES byte-identity
        # to the JP ROM. One step = the old `make compare` + `Self-contained build`.
        run: make compare

      # ---- Shiftability gate (scripts/shiftcheck/, D313) ----
      - name: Shiftability validation (make shiftcheck — blocking)
        # Reuses the objects make compare just built: relinks ONCE with --emit-relocs
        # and runs the static layers (build-system address audit + reloc-coverage scan
        # + cross-resource offset scan). Fails on any HIGH-confidence hardcoded ROM
        # pointer (a raw 0x08xxxxxx literal that would break a layout shift). Never
        # touches the matching build / $(ROM). Layer-2 differential shift is N/A to
        # fe8j's packed layout and intentionally excluded (see scripts/shiftcheck/
        # README.md and docs/decisions.md D313).
        run: make shiftcheck

      # ---- Progress reports (non-blocking, reuse the built objects) ----
      - name: Compute progress
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 scripts/calcprogress.py | tee progress.txt

      - name: Generate decomp.dev report (jp_report)
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 scripts/gen-report.py progress.txt report.json

      - name: Upload decomp.dev report artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jp_report
          path: report.json

      - name: Publish progress to frogress
        if: ${{ github.event_name != 'pull_request' && env.PROGRESS_API_KEY != '' }}
        continue-on-error: true
        run: |
          python3 scripts/upload-progress.py \
            -b "https://progress.deco.mp" -a "$PROGRESS_API_KEY" \
            -p fireemblem8j -v jp -t scripts/progress-template.txt progress.txt

      # ---- GitHub Pages site (main-push only; reuses the ELF + progress.txt above) ----
      # Consolidated from the old .github/workflows/pages.yml so the expensive
      # agbcc+toolchain+`make compare` build runs ONCE per commit instead of twice.
      # PRs run the build + compare + shiftcheck gates above but never generate or
      # deploy Pages. The actual deploy is a separate least-privilege job below.
      - name: Generate Pages site
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: python3 scripts/gen_pages.py

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # ---- Deploy the Pages artifact (main-push only, isolated pages:write token) ----
  # Separate job so the heavy `ci` job keeps a minimal contents:read token. The
  # `concurrency: pages` group SERIALIZES deploys (never cancels) -- this is the
  # correct fix for the deploy race that the reverted cron+cancel-in-progress hack
  # (ae660367d) tried to paper over. No schedule/cron: one deploy per push.
  deploy:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
