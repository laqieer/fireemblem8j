name: layout consistency

# Fast repo-consistency gate (no toolchain, no ROM): every object the whole-ROM build
# links must have a git-tracked source. Catches the "a carve added a layout row but didn't
# commit the .s/.c source" class -- it builds LOCALLY (a stale .o survives `make clean`
# because the asm/*.s wildcard can't see the deleted .s) but fails the real `make compare`
# job in CI's fresh checkout with `ld: cannot find asm/X.o`. This runs in seconds and on
# forks (no BASEROM_URL secret needed), so the failure is caught immediately, not buried.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layout-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every layout-referenced object has a committed source
        run: python3 scripts/check_layout.py
