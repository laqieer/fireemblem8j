name: decomp.dev report

# Publishes decompilation progress to decomp.dev (https://decomp.dev), the
# per-project decomp-progress tracker. decomp.dev ingests an objdiff-format
# progress report uploaded as a workflow artifact named `<version>_report` on the
# default branch; for this JP decomp the version slug is `jp`, so the artifact is
# `jp_report` and its payload is `report.json`. This mirrors the US sibling
# (../fireemblem8u), whose Build CI uploads a `us_report` artifact the same way.
#
# We synthesise report.json from scripts/calcprogress.py via scripts/gen-report.py
# rather than running `objdiff-cli report generate`: the latter needs a carved
# target object per unit (built from baserom.gba), and this incbin-baseline decomp
# has no committed tooling to produce a full set of those (see docs/decomp-dev.md
# and docs/tools/objdiff.md). report.json carries the same top-level objdiff
# `measures` block decomp.dev reads. Building src/*.o needs only agbcc + binutils,
# NOT the (gitignored, copyrighted) baserom -- so this workflow needs no ROM.
#
# Prerequisites the repo owner must complete (see docs/decomp-dev.md):
#   1. Register fireemblem8j at https://decomp.dev/manage/new (repo admin) once
#      this workflow has uploaded a `jp_report` artifact on the default branch.
#   2. Install the decomp.dev GitHub App on the repo so it picks up new reports.
# No API key or repository secret is required for the report upload itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

# decomp.dev reads the artifact from the workflow run; only read access is needed.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth needed: calcprogress reads layout/*.tsv + builds src/*.o,
      # and gen-report reads progress.txt -- neither walks git history.
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git
          cd agbcc && ./build.sh && ./install.sh .. && cd ..

      # Compute coarse progress from the carve manifest (layout/*.tsv) and the
      # decompiled src/*.o objects (agbcc-built; no baserom needed).
      - name: Compute progress
        run: python3 scripts/calcprogress.py | tee progress.txt

      # decomp.dev ingests an objdiff report (the top-level `measures` block);
      # gen-report.py converts calcprogress output into that format.
      - name: Generate decomp.dev report
        run: python3 scripts/gen-report.py progress.txt report.json

      # Upload as `jp_report` (matches the `jp` version slug). decomp.dev scrapes
      # this artifact from default-branch runs once the project is registered.
      - name: Upload decomp.dev report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp_report
          path: report.json
