name: Decomp progress

# Computes decompilation progress and publishes it to the frogress API
# (https://progress.deco.mp) so it charts on the FE Decomp Portal
# (https://laqieer.github.io/fe-decomp-portal/) alongside fe8u/fe6j/fe7j.
#
# The upload step is gated on the PROGRESS_API_KEY repository secret: until the
# frogress API owner creates the `fireemblem8j` project and provides the key,
# the workflow still runs and computes progress, but skips publishing. Add the
# secret (Settings > Secrets and variables > Actions) to enable publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  progress:
    runs-on: ubuntu-latest
    env:
      PROGRESS_API_KEY: ${{ secrets.PROGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # upload-progress.py needs the commit timestamp + hash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev
          python -m pip install ttp requests

      - name: Install agbcc
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git
          cd agbcc && ./build.sh && ./install.sh .. && cd ..

      - name: Compute progress
        run: |
          python3 scripts/calcprogress.py | tee progress.txt

      - name: Publish progress
        # Best-effort, non-blocking: portal publishing is cosmetic and runs on
        # every push, so a transient frogress hiccup must never fail CI. The step
        # still runs and logs the response body; a real outage shows as a warning.
        continue-on-error: true
        if: ${{ env.PROGRESS_API_KEY != '' }}
        run: |
          python3 scripts/upload-progress.py \
            -b "https://progress.deco.mp" \
            -a "$PROGRESS_API_KEY" \
            -p fireemblem8j -v jp \
            -t scripts/progress-template.txt progress.txt

      - name: Note when skipped
        if: ${{ env.PROGRESS_API_KEY == '' }}
        run: echo "PROGRESS_API_KEY secret not set - computed progress but skipped publishing."
