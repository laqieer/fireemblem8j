name: Secret scan (ggshield)

# GitGuardian ggshield secret scanning (SECURITY.md). Fast, independent of the
# heavy build in ci.yml. Scans pushed commits and same-repo PRs; fork PRs (which
# can't receive the GITGUARDIAN_API_KEY secret) are covered by the GitGuardian
# GitHub App instead.
#
# ACTIVATION: add repo secret GITGUARDIAN_API_KEY (Settings -> Secrets and
# variables -> Actions; create a token at https://dashboard.gitguardian.com).
# Until it is set, the scan step is skipped (not failed) so it never blocks PRs,
# and the GitGuardian App still scans in the meantime.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ggshield:
    # Skip fork PRs (no secret available -> the GitGuardian App scans those).
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ggshield needs full history to scan the commit range
      - name: GitGuardian ggshield scan
        # Skip (don't fail) until the API key secret is configured.
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        uses: GitGuardian/ggshield-action@2002482fb5990b486be5598ebcf48a8eba393fce # v1.53.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
