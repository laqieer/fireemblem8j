# decomp-permuter configuration for FE8J (agbcc / GBA Thumb).
# Read by tools/decomp-permuter/import.py. See docs/reverse-engineering.md and
# scripts/permuter/ for the wrapper + usage.
#
# agbcc is GCC 2.x-era, so the "gcc" randomization weights fit best.
compiler_type = "gcc"

# How a candidate .c is compiled to an object. import.py inserts the input file
# before the first `|` and appends `-o <output.o>`. This mirrors the Makefile C
# rule: cpp (idempotent on the already-preprocessed base.c) | iconv UTF-8->CP932
# | agbcc -> .s | arm-none-eabi-as -> .o. -Werror is dropped so a valid-but-warny
# permutation still compiles. (scripts/permuter/compile.sh is the hand-written,
# byte-validated equivalent that the wrapper drops in, incl. the `.ALIGN` step.)
compiler_command = "cpp -P -undef -I tools/agbcc/include -iquote include -iquote . -nostdinc | iconv -f UTF-8 -t CP932 | tools/agbcc/bin/agbcc -mthumb-interwork -Wimplicit -Wparentheses -O2 -fhex-asm -ffix-debug-line -g -o /dev/stdout | arm-none-eabi-as -mcpu=arm7tdmi -mthumb-interwork -I include -I ."

# How the target .s (the JP function's descriptive disassembly) is assembled to
# target.o, matching the Makefile's ASFLAGS so relocations line up.
assembler_command = "arm-none-eabi-as -mcpu=arm7tdmi -mthumb-interwork -I include -I ."

# Prepended to the target .s (defines `glabel`, sets Thumb).
asm_prelude_file = "scripts/permuter/prelude.inc"

# NOTE: don't set objdump_command — the scorer auto-detects ARM from the target
# object (ELF e_machine) and uses `arm-none-eabi-objdump -drz`. Overriding it with
# a bare path drops the `-drz` flags and the scorer fails.
#
# NOTE (fork eval, 2026-06): the WhenGryphonsFly/decomp-permuter-agbcc fork was
# evaluated; recommendation is to KEEP upstream — see docs/tools/decomp-permuter-agbcc.md.
# But adopt the fork's one substantive agbcc fix ("invalid zero scores"): import.py
# generates each nonmatchings/<func>/compile.sh from THIS compiler_command without
# `set -o pipefail`, and the command above is a single pipe (cpp|iconv|agbcc|as), so
# a crashing agbcc can still be masked by a succeeding `as` and yield a false 0 score.
# scripts/permuter/compile.sh fixes this (set -euo pipefail + two-step agbcc->as) but
# is NOT on the active import path unless compiler_command invokes it. TODO (coordinator
# e2e, needs tools/agbcc + baserom.gba to re-validate bytes): point compiler_command at
# scripts/permuter/compile.sh (folding in the cpp step), or add pipefail to the pipeline.
# Do not switch the config to the fork's `agbcc | as` single-pipe template; it
# omits the UTF-8->CP932 iconv step FE8J requires. The fork also pins ~10 months behind
# upstream's randomizer/scorer and swaps our `.s`-based import for a prebuilt-`.o` flow.
