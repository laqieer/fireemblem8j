# coddog / decomp_settings config for the US sibling decomp (FE8U), used as the
# second binary in `coddog compare2`. Paths are resolved relative to the dir
# CONTAINING this yaml when handed to compare2 — the docs place a copy of this
# file at the JP repo root, so `../fireemblem8u/...` points at the sibling repo.
#
# This is a convenience split of the `us` version in fe8.coddog.yaml so you can
# write the two-binary compare as:
#   coddog compare2 fe8.coddog.yaml jp fe8u.coddog.yaml us --sort-by similarity
#
# Schema: https://github.com/ethteck/decomp_settings

name: Fire Emblem - The Sacred Stones (US)
repo: https://github.com/FireEmblemUniverse/fireemblem8u
platform: gba

versions:
  - name: us
    fullname: USA (BE8E)
    paths:
      target: ../fireemblem8u/fireemblem8.gba
      build_dir: ../fireemblem8u/build
      map: ../fireemblem8u/fireemblem8.map
      compiled_target: ../fireemblem8u/fireemblem8.gba
      elf: ../fireemblem8u/fireemblem8.elf   # <-- US ELF coddog reads
      asm: ../fireemblem8u/asm
